name: Carico le pagine sul sito

on:
  push:
    branches: [main]
    paths: ["sito/previsioni-wrf-lazio.html"]       # la pagina delle previsioni si ricarica da sola a ogni modifica
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sito
  cancel-in-progress: false

jobs:
  carica:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Carico via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_CARTELLA: ${{ secrets.FTP_CARTELLA }}
        run: bash wrf/carica_sito.sh sito/previsioni-wrf-lazio.html
